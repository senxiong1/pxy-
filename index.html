<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的书稿写作本</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#f7f5f2;padding:20px;font-family:system-ui,sans-serif}
        .container{max-width:900px;margin:0 auto}
        h1{font-size:24px;color:#333;margin-bottom:16px}
        .btn-group{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
        button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;background:#339966;color:white;font-size:16px}
        textarea{width:100%;min-height:600px;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:16px;line-height:1.6}
        .tip{color:#666;margin-top:10px;font-size:14px}
    </style>
</head>
<body>
<div class="container">
    <h1>我的书稿写作本</h1>
    <div class="btn-group">
        <button id="exportBtn">导出TXT备份</button>
        <button id="shareBtn">生成分享链接</button>
    </div>
    <textarea id="content"></textarea>
    <div class="tip">自动保存（保存在本机浏览器）｜分享链接会把文字放在网址里，发给好友即可直接查看</div>
</div>

<script>
const textarea = document.getElementById('content');
const storageKey = 'bookText';

// 读取URL里面携带的文字，如果有就加载
const urlParams = new URLSearchParams(window.location.search);
const shareText = urlParams.get('txt');
if(shareText){
    textarea.value = decodeURIComponent(shareText);
} else {
    // 没有分享参数，读取本地保存的内容
    textarea.value = localStorage.getItem(storageKey) || '';
}

// 自动保存到本地
let timer;
textarea.addEventListener('input',()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{
        localStorage.setItem(storageKey, textarea.value);
    }, 3000);
})

// 导出txt文件
document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([textarea.value], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '书稿.txt';
    a.click();
}

// 生成分享链接
document.getElementById('shareBtn').onclick = ()=>{
    const text = textarea.value.trim();
    if(!text){
        alert('内容不能为空！');
        return;
    }
    const encoded = encodeURIComponent(text);
    const shareUrl = `${location.origin}${location.pathname}?txt=${encoded}`;
    navigator.clipboard.writeText(shareUrl).then(()=>{
        alert('分享链接已复制！直接发给朋友，点开就能看到这段文字');
    }).catch(()=>{
        prompt('复制下面这个分享链接：', shareUrl);
    })
}
</script>
</body>
</html>
